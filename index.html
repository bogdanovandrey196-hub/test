<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по анатомии (82-119)</title>
<style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; }
    .question { margin-bottom: 20px; padding: 15px; border-bottom: 1px solid #eee; }
    .question p { font-weight: bold; margin-bottom: 10px; }
    label { display: block; margin: 5px 0; cursor: pointer; }
    input[type="checkbox"] { margin-right: 8px; }
    
    /* Кнопки */
    button { display: block; width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; margin-top: 20px; transition: 0.2s; }
    button:hover { background: #218838; }
    
    #restartBtn { background: #007bff; display: none; margin-top: 15px; }
    #restartBtn:hover { background: #0056b3; }
    
    #result { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; text-align: center; font-size: 20px; font-weight: bold; display: none; }
    .correct { color: green; font-weight: bold; }
    .incorrect { color: red; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
    <h1>Тест по анатомии (вопросы 82–119)</h1>
    <p style="text-align: center; color: #666; font-size: 14px;">Проходной балл: 80 из 100</p>
    <form id="quizForm"></form>
    
    <!-- Кнопка проверки -->
    <button id="checkBtn" onclick="checkAnswers()">Проверить результаты</button>
    
    <div id="result"></div>
    
    <!-- Кнопка перезапуска -->
    <button id="restartBtn" onclick="restartQuiz()">Пройти заново</button>
</div>

<script>
// Исходный массив вопросов
const allQuestions = [
    { id: 82, text: "Мышечная и сосудистая лакуны между собой разграничены:", options: ["паховой связкой", "бедренной веной", "подвздошно-гребенчатой дугой", "серповидным краем fascia lata"], correct: [2] },
    { id: 83, text: "Мышцы, разгибающие предплечье:", options: ["трехглавая", "длинная головка трехглавой", "локтевая", "дельтовидная", "плечелучевая"], correct: [0, 2] },
    { id: 84, text: "Мышцы, сгибающие предплечье:", options: ["двуглавая", "плечевая", "плечелучевая", "круглый пронатор", "квадратный пронатор"], correct: [0, 1, 2] },
    { id: 85, text: "Мышцы, приводящие кисть:", options: ["локтевой сгибатель запястья", "лучевой сгибатель запястья", "локтевой разгибатель запястья", "длинный лучевой разгибатель запястья", "короткий лучевой разгибатель запястья"], correct: [0, 2] },
    { id: 86, text: "Мышцы, разгибающие кисть:", options: ["короткий лучевой разгибатель запястья", "длинный лучевой разгибатель запястья", "локтевой разгибатель запястья", "плечелучевая", "квадратный пронатор", "разгибатель пальцев"], correct: [0, 1, 2, 5] },
    { id: 87, text: "Мышцы, отводящие кисть:", options: ["локтевой разгибатель кисти", "длинный лучевой разгибатель кисти", "короткий лучевой разгибатель кисти", "локтевой сгибатель кисти", "лучевой сгибатель кисти"], correct: [1, 2, 4] },
    { id: 88, text: "Мышцы, сгибающие кисть:", options: ["лучевой сгибатель запястья", "локтевой сгибатель запястья", "плечелучевая", "глубокий сгибатель пальцев", "поверхностный сгибатель пальцев", "квадратный пронатор"], correct: [0, 1, 3, 4] },
    { id: 89, text: "Мышцы, сгибающие плечо:", options: ["передняя часть дельтовидной", "двуглавая", "трехглавая", "большая грудная", "клювоплечевая", "трапециевидная"], correct: [0, 1, 4] },
    { id: 90, text: "Мышцы, опускающие нижнюю челюсть:", options: ["надподъязычные мышцы", "грудиноключично-сосцевидные", "височная, жевательная", "крыловидные"], correct: [0] },
    { id: 91, text: "Мышцы, поднимающие нижнюю челюсть:", options: ["височная", "жевательная", "латеральная крыловидная", "медиальная крыловидная", "мышцы, поднимающие углы рта"], correct: [0, 1, 3] },
    { id: 92, text: "Слабые места диафрагмы:", options: ["сухожильный центр", "отверстие нижней половой вены", "грудинореберный треугольник", "пояснично-реберный треугольник", "отверстие между ножками"], correct: [2, 3] },
    { id: 93, text: "Листки фасции шеи по РАN:", options: ["поверхностные", "внутренностные", "париетальные", "претрахеальные", "предпозвоночные"], correct: [0, 3, 4] },
    { id: 94, text: "Стенки сонного треугольника шеи:", options: ["грудиноключично-сосцевидная", "трапециевидная", "лопаточно-подъязычная", "двубрюшная", "ключица"], correct: [0, 2, 3] },
    { id: 95, text: "Перечислите слабые места стенок живота:", options: ["приводящий канал", "паховый канал", "влагалище прямой мышцы живота", "белая линия живота", "пупочное кольцо", "поясничный треугольник"], correct: [1, 3, 4, 5] },
    { id: 96, text: "Белая линия живота образована:", options: ["фасциями живота", "мышцами живота", "апоневрозами широких мышц живота", "перимизием", "брюшиной"], correct: [2] },
    { id: 97, text: "Нижняя стенка пахового канала образована:", options: ["поперечной фасцией", "паховой связкой", "лакунарной связкой", "гребешковой связкой", "бедренной веной"], correct: [1] },
    { id: 98, text: "Чем образована задняя стенка пахового канала?", options: ["поперечной мышцей живота", "поперечной фасцией", "внутренней косой мышцей живота", "поверхностной фасцией живота", "прямой мышцей живота"], correct: [1] },
    { id: 99, text: "Передняя стенка пахового канала образована:", options: ["апоневрозом наружной косой мышцы", "поперечной фасцией", "поверхностной фасцией живота"], correct: [0] },
    { id: 100, text: "Паховая связка образована:", options: ["фасцией поперечной мышцы живота", "апоневрозом поперечной мышцы живота", "апоневрозом наружной косой мышцы живота", "апоневрозом внутренней косой мышцы живота"], correct: [2] },
    { id: 101, text: "Содержимое пахового канала у мужчин:", options: ["семенной канатик", "круглая связка", "нервы", "бедренные артерия и вена", "мочеточник"], correct: [0, 2] },
    { id: 102, text: "Мышцы, разгибающие бедро:", options: ["двуглавая", "полусухожильная", "полуперепончатая", "четырехглавая", "большая ягодичная", "подвздошно-поясничная"], correct: [0, 1, 2, 4] },
    { id: 103, text: "Мышцы, сгибающие бедро:", options: ["прямая", "двуглавая", "гребенчатая", "нежная", "портняжная", "подвздошно-поясничная"], correct: [0, 2, 3, 4, 5] },
    { id: 104, text: "Мышцы, приводящие бедро:", options: ["большая приводящая", "длинная приводящая", "короткая приводящая", "напрягатель fascia lata", "гребенчатая", "нежная", "четырехглавая"], correct: [0, 1, 2, 4, 5] },
    { id: 105, text: "Мышцы, разгибающие голень:", options: ["четырехглавая", "двуглавая", "передняя большеберцовая"], correct: [0] },
    { id: 106, text: "Чем ограничена мышечная лакуна?", options: ["паховой связкой", "бедренной костью", "тазовой костью", "бедренной веной", "подвздошно-гребенчатой дугой"], correct: [0, 4] },
    { id: 107, text: "Через мышечную лакуну проходит мышца:", options: ["грушевидная", "подвздошно-поясничная", "гребенчатая", "портняжная"], correct: [1] },
    { id: 108, text: "Границы бедренного треугольника:", options: ["паховая связка", "портняжная мышца", "гребенчатая мышца", "большая приводящая мышца", "длинная приводящая мышца", "короткая приводящая мышца"], correct: [0, 1, 4] },
    { id: 109, text: "Перечислите стенки внутреннего отверстия бедренного канала:", options: ["паховая связка", "поперечная фасция", "гребенчатая связка", "лакунарная связка", "серповидный край fascia lata", "бедренная вена", "портняжная мышца"], correct: [0, 2, 3, 5] },
    { id: 110, text: "Поверхностное кольцо бедренного канала ограничено:", options: ["семенным канатиком", "подвздошно-гребенчатой дугой", "паховой связкой", "серповидным краем широкой фасции бедра"], correct: [3] },
    { id: 111, text: "Наружное отверстие бедренного канала ограничено:", options: ["паховой связкой", "бедренной веной", "серповидным краем fascia lata", "краем поперечной фасции"], correct: [2] },
    { id: 112, text: "Бедренный треугольник ограничен:", options: ["паховой связкой", "наружной запирательной мышцей", "портняжной мышцей", "длинной приводящей мышцей", "широкой фасцией бедра"], correct: [0, 2, 3] },
    { id: 113, text: "Через какие образования полость таза сообщается с ягодичной областью и областью бедренного треугольника?", options: ["паховый канал", "сосудистая лакуна", "мышечная лакуна", "пупочное кольцо", "над- и подгрушевидные отверстия", "малое седалищное отверстие", "приводящий канал", "запирательный канал"], correct: [1, 2, 4, 5, 7] },
    { id: 114, text: "Через большое седалищное отверстие проходит мышца:", options: ["подвздошно-поясничная", "внутренняя запирательная", "наружная запирательная", "грушевидная"], correct: [3] },
    { id: 115, text: "Стенки приводящего канала:", options: ["короткая приводящая мышца", "длинная приводящая мышца", "большая приводящая мышца", "медиальная головка четырехглавой мышцы", "портняжная мышца", "фиброзная пластинка"], correct: [2, 3, 5] },
    { id: 116, text: "Стенки подколенной ямки:", options: ["мышцы задней группы бедра", "приводящие мышцы бедра", "длинная малоберцовая мышца", "икроножная мышца", "задняя большеберцовая мышца"], correct: [0, 3] },
    { id: 117, text: "Стенки плечемышечного канала:", options: ["клювоплечевая мышца", "плечевая мышца", "плечевая кость", "двуглавая мышца", "трехглавая мышца"], correct: [0, 1, 2] },
    { id: 118, text: "В подколенную ямку открываются каналы:", options: ["бедренный", "приводящий", "голеноподколенный", "верхний мышечно-малоберцовый"], correct: [1, 2] },
    { id: 119, text: "Части диафрагмы:", options: ["позвоночная", "реберная", "грудинная", "поясничная", "грудная"], correct: [1, 2] }
];

let questions = []; // Переменная для текущего перемешанного списка

// Перемешивание массива
function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

// Функция отрисовки теста
function renderQuiz() {
    // Сбрасываем старый результат и кнопки
    document.getElementById('result').style.display = 'none';
    document.getElementById('result').innerHTML = '';
    document.getElementById('restartBtn').style.display = 'none';
    document.getElementById('checkBtn').style.display = 'block';
    document.getElementById('quizForm').innerHTML = '';

    // Перемешиваем вопросы заново
    questions = shuffle([...allQuestions]);

    const form = document.getElementById('quizForm');
    
    questions.forEach((q, index) => {
        const shuffledOptions = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
        shuffle(shuffledOptions);

        const div = document.createElement('div');
        div.className = 'question';
        div.innerHTML = `<p>${index + 1}. ${q.text}</p>`;
        
        shuffledOptions.forEach((opt) => {
            const label = document.createElement('label');
            label.innerHTML = `<input type="checkbox" name="q${index}" value="${opt.originalIndex}"> ${opt.text}`;
            div.appendChild(label);
        });
        form.appendChild(div);
    });
}

// Проверка ответов
function checkAnswers() {
    let score = 0;
    const total = questions.length;
    
    questions.forEach((q, index) => {
        const checkboxes = document.querySelectorAll(`input[name="q${index}"]:checked`);
        const selected = Array.from(checkboxes).map(cb => parseInt(cb.value)).sort((a, b) => a - b);
        const correctSorted = [...q.correct].sort((a, b) => a - b);
        
        const isCorrect = JSON.stringify(selected) === JSON.stringify(correctSorted);
        if (isCorrect) score++;
        
        document.querySelectorAll(`input[name="q${index}"]`).forEach(input => {
            const label = input.parentElement;
            label.classList.remove('correct', 'incorrect');
            if (q.correct.includes(parseInt(input.value))) {
                label.classList.add('correct');
            } else if (input.checked) {
                label.classList.add('incorrect');
            }
        });
    });

    const percent = Math.round((score / total) * 100);
    const resultDiv = document.getElementById('result');
    resultDiv.style.display = 'block';
    
    let statusText = percent >= 80 ? "✅ ТЕСТ ПРОЙДЕН" : "❌ ТЕСТ НЕ ПРОЙДЕН (нужно 80+)";
    
    resultDiv.innerHTML = `Вы ответили правильно на <b>${score}</b> из <b>${total}</b> вопросов.<br>
    Ваш результат: <b>${percent} / 100</b> баллов.<br>
    <span style="font-size: 24px; margin-top: 10px; display: block;">${statusText}</span>`;
    
    if(percent >= 80) {
        resultDiv.style.background = '#d4edda';
        resultDiv.style.color = '#155724';
    } else {
        resultDiv.style.background = '#f8d7da';
        resultDiv.style.color = '#721c24';
    }

    // Меняем кнопки: скрываем "Проверить", показываем "Пройти заново"
    document.getElementById('checkBtn').style.display = 'none';
    document.getElementById('restartBtn').style.display = 'block';
    
    // Прокрутка к результату
    resultDiv.scrollIntoView({ behavior: 'smooth' });
}

// Функция перезапуска
function restartQuiz() {
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Запускаем тест при загрузке страницы
renderQuiz();
</script>
</body>
</html>
